<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" aria-hidden="true">
  <!-- 占位图：竖屏手机 App —— 世界流（feed）。换成真素材时直接替成竖版 GIF/MP4。 -->
  <defs>
    <style>
      .t{fill:var(--c,#0C26FF)}
      .l{fill:var(--c,#0C26FF);opacity:.5}
      .r{fill:var(--c,#0C26FF);opacity:.75}
      .b{--c:#0C26FF}
