<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" aria-hidden="true">
  <!-- 占位图：竖屏手机 App —— 一键发布到世界流（publish sheet）。 -->
  <defs>
    <style>
      .t{fill:var(--c,#0C26FF)}
      .l{fill:var(--c,#0C26FF);opacity:.5}
      .r{fill:var(--c,#0C26FF);opacity:.75}
      .b{--c:#0C26FF}
      .m{--c:#4ec3b0}
    </style>
    <symbol id="cube" viewBox="0 0 100 100">
      <path class="t" d="M50 17 92 38 50 59 8 38Z"/>
      <path class="l" d="M8 38 8 78 50 99 50 59Z"/>
      <path class="r" d="M92 38 92 78 50 99 50 59Z"/>
    </symbol>
    <symbol id="ball" viewBox="0 0 100 100">
      <circle cx="50" cy="52" r="36" fill="var(--c,#0C26FF)" opacity=".85"/>
      <circle cx="37" cy="39" r="11" fill="#ffffff" opacity=".5"/>
    </symbol>
    <symbol id="spark" viewBox="0 0 100 100">
      <path d="M50 4C56 33 67 44 96 50 67 56 56 67 50 96 44 67 33 56 4 50 33 44 44 33 50 4Z" fill="var(--c,#0C26FF)"/>
    </symbol>
  </defs>

  <rect width="1080" height="1920" fill="#f2f3fb"/>

  <!-- 上半屏：世界预览 -->
  <rect x="70" y="140" width="940" height="1000" rx="48" fill="#e5e8f6"/>
  <g transform="translate(0 55)">
    <path d="M540 535 870 700 540 865 210 700Z" fill="#ffffff" opacity=".6"/>
    <g stroke="#0C26FF" stroke-width="4" opacity=".16" stroke-linecap="round">
      <path d="M375 782 705 617"/>
      <path d="M375 617 705 782"/>
    </g>
    <use href="#cube" class="b" x="365" y="572" width="190" height="190"/>
    <use href="#cube" class="m" x="545" y="643" width="150" height="150"/>
    <use href="#ball" class="b" x="645" y="587" width="110" height="110"/>
    <use href="#spark" class="m" x="738" y="472" width="54" height="54" opacity=".85"/>
    <use href="#spark" class="b" x="330" y="520" width="40" height="40" opacity=".6"/>
  </g>
  <!-- 预览角标 -->
  <rect x="120" y="190" width="190" height="60" rx="30" fill="#ffffff" opacity=".9"/>
  <circle cx="152" cy="220" r="11" fill="#4ec3b0"/>
  <rect x="176" y="209" width="106" height="22" rx="11" fill="#14161a" opacity=".18"/>

  <!-- 底部发布面板 -->
  <rect x="0" y="1180" width="1080" height="800" rx="56" fill="#ffffff"/>
  <rect x="490" y="1222" width="100" height="12" rx="6" fill="#14161a" opacity=".14"/>
  <rect x="110" y="1290" width="520" height="32" rx="16" fill="#14161a" opacity=".2"/>
  <rect x="110" y="1350" width="330" height="24" rx="12" fill="#14161a" opacity=".1"/>
  <rect x="850" y="1285" width="120" height="120" rx="24" fill="#e5e8f6"/>
  <use href="#cube" class="b" x="880" y="1305" width="60" height="60"/>

  <!-- 标签 -->
  <rect x="110" y="1440" width="190" height="60" rx="30" fill="#0C26FF" opacity=".08"/>
  <rect x="320" y="1440" width="150" height="60" rx="30" fill="#0C26FF" opacity=".08"/>
  <rect x="490" y="1440" width="210" height="60" rx="30" fill="#0C26FF" opacity=".08"/>

  <!-- 发布按钮 -->
  <use href="#spark" class="m" x="878" y="1498" width="46" height="46" opacity=".9"/>
  <use href="#spark" class="b" x="150" y="1506" width="36" height="36" opacity=".6"/>
  <rect x="110" y="1570" width="860" height="150" rx="75" fill="#0C26FF"/>
  <path d="M420 1673v-56M396 1641l24-24 24 24" fill="none" stroke="#ffffff" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="470" y="1632" width="220" height="26" rx="13" fill="#ffffff" opacity=".85"/>

  <rect x="440" y="1810" width="200" height="12" rx="6" fill="#14161a" opacity=".14"/>
</svg>
