       浏览器就会拿旧样式去配新 HTML（社交图标变巨大、Our Games 栅格错位就是这么来的）。
       每次改 css/ 或 js/ 里的文件，把全部页面上的 v= 一起换成当天日期。 -->
  <link rel="stylesheet" href="css/style.css?v=20260808" />

  <section class="section section--tiles">
    <div class="section-inner">
      <!--
        每加一款游戏：复制一个 .tile，指向新的 game-*.html（可直接复制 hua.html 改写），
        并把下面的 .tile-soon 占位卡删掉 —— 网格固定两栏，占位卡只是用来占住空着的那一格。
        PRE-LAUNCH：.tile-status 只能写 "Upcoming" / "In development" 这类未发布措辞，不得暗示已上架。
        极简版：卡片留封面 + 状态标签 + 名字 + 一句话，完整说明放在各自的详情页。
        .tile-desc 固定裁到两行，多写的字会被截断，卡片高度才对得齐。
      -->
      <div class="tiles">
        <a class="tile reveal" href="hua.html" style="--delay: 0ms">
          <div class="tile-art tile-art--band" aria-hidden="true">
            <img class="tile-art-img" src="assets/games/roof-band/cover.jpg" alt=""
                 width="960" height="720" />
          </div>
          <p class="tile-status">Upcoming</p>
          <div class="tile-body">
            <div class="tile-text">
              <h2 class="tile-title">Hua</h2>
              <p class="tile-desc">
                A cozy harmonica game. Play it slow, play it your way, play it again.
              </p>
            </div>
            <span class="tile-more" aria-hidden="true">&rarr;</span>
          </div>
        </a>

        <div class="tile-soon reveal" style="--delay: 110ms">
          <div>
            <p class="tile-soon-mark">Coming soon</p>
          </div>
        </div>

        <!--
        <a class="tile reveal" href="game-NEXT.html" style="--delay: 110ms">
          <div class="tile-art" aria-hidden="true"><span class="tile-art-mark">XX</span></div>
          <p class="tile-status">In development</p>
          <div class="tile-body">
            <h2 class="tile-title">Title</h2>
            <span class="tile-more" aria-hidden="true">&rarr;</span>
          </div>
        </a>
        -->
      </div>
    </div>
  </section>
